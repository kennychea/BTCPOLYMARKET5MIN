[project]
name = "polybot"
version = "0.1.0"
description = "Trading bot for Polymarket BTC 5-minute Up/Down prediction markets"
requires-python = ">=3.13"
dependencies = [
    "websockets>=14.0",
    "aiohttp>=3.11",
    "pydantic>=2.10",
    "tomli>=2.2",
    "python-dotenv>=1.0",
    "py-clob-client>=0.5",
    "hyperliquid-python-sdk>=0.22",
    "pandas>=2.2",
    "termcolor>=2.4",
    "eth-account>=0.13",
    "requests>=2.32",
    "web3>=7.0",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
